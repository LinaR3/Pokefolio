<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#05151d">
    <title>Air Race: Ocean Run · Pokefolio</title>
    <style>
      * { box-sizing: border-box; }
      html, body, #unity-container { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #05151d; }
      #unity-container { position: fixed; inset: 0; }
      #unity-canvas { display: block; width: 100%; height: 100%; outline: none; background: #05151d; }
      #unity-loading { position: absolute; inset: 0; display: grid; place-content: center; gap: 14px; color: #f5c83c; font: 700 13px/1.4 system-ui, sans-serif; letter-spacing: .12em; text-align: center; }
      #unity-progress { width: min(52vw, 300px); height: 5px; overflow: hidden; border-radius: 10px; background: #ffffff25; }
      #unity-progress-fill { width: 0; height: 100%; background: #f5c83c; transition: width .15s linear; }
      #unity-error { position: absolute; top: 12px; left: 12px; right: 12px; padding: 12px; background: #9c1938; color: white; font: 14px/1.4 system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <main id="unity-container" aria-label="Air Race: Ocean Run">
      <canvas id="unity-canvas" tabindex="-1" aria-label="Juego Air Race: Ocean Run"></canvas>
      <div id="unity-loading" role="status" aria-live="polite">
        <span>CARGANDO AIR RACE: OCEAN RUN</span>
        <div id="unity-progress"><div id="unity-progress-fill"></div></div>
      </div>
      <div id="unity-error" role="alert" hidden></div>
    </main>
    <script>
      const canvas = document.querySelector('#unity-canvas')
      const buildUrl = 'Build'
      const config = {
        arguments: [],
        dataUrl: `${buildUrl}/WebBuild.data.br`,
        frameworkUrl: `${buildUrl}/WebBuild.framework.js.br`,
        codeUrl: `${buildUrl}/WebBuild.wasm.br`,
        streamingAssetsUrl: 'StreamingAssets',
        companyName: 'Lina Reina',
        productName: 'Air Race Ocean Run',
        productVersion: '0.1.0',
        showBanner: (message) => {
          const error = document.querySelector('#unity-error')
          error.textContent = message
          error.hidden = false
        },
      }
      const loader = document.createElement('script')
      loader.src = `${buildUrl}/WebBuild.loader.js`
      loader.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector('#unity-progress-fill').style.width = `${Math.round(progress * 100)}%`
        }).then(() => {
          document.querySelector('#unity-loading').hidden = true
        }).catch((message) => {
          const error = document.querySelector('#unity-error')
          error.textContent = message
          error.hidden = false
        })
      }
      loader.onerror = () => {
        const error = document.querySelector('#unity-error')
        error.textContent = 'No se pudo cargar el juego. Inténtalo de nuevo.'
        error.hidden = false
      }
      document.body.append(loader)
    </script>
  </body>
</html>
